<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOLOCHAT — Version statique</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
      --ok: #4ade80;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 780px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.15rem; }
    .sub { color: var(--muted); font-size: 0.85rem; }
    .box { padding: 20px; }
    .grid { display: grid; gap: 12px; }
    input, textarea, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel-2);
      color: var(--text);
    }
    button {
      padding: 10px 14px;
      background: var(--accent);
      color: #06202a;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .msg {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .msg img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .composer {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      background: var(--panel-2);
      display: grid;
      gap: 10px;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .error { color: var(--danger); font-size: 0.9rem; }
    .ok { color: var(--ok); font-size: 0.9rem; }
    .invite-code {
      font-family: monospace;
      background: var(--panel-2);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px dashed var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
    const KEYS = {
      users: "lolochat_static_users_v1",
      invites: "lolochat_static_invites_v1",
      messages: "lolochat_static_messages_v1",
      session: "lolochat_static_session_v1"
    };

    const MAX_TEXT = 2000;
    const MAX_IMG_BYTES = 5 * 1024 * 1024;
    let pendingImage = null;
    let statusMsg = "";
    let errorMsg = "";

    const load = (k, fallback) => {
      try { return JSON.parse(localStorage.getItem(k)) ?? fallback; }
      catch { return fallback; }
    };
    const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    async function hashPassword(pw) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function ensureInitialInvite() {
      const invites = load(KEYS.invites, []);
      const users = load(KEYS.users, []);
      if (invites.length === 0 && users.length === 0) {
        invites.push({ code: "LOLO-START-2026", used: false });
        save(KEYS.invites, invites);
      }
    }

    function createInvite() {
      const invites = load(KEYS.invites, []);
      const code = "LOLO-" + Math.random().toString(36).substring(2, 8).toUpperCase();
      invites.push({ code, used: false });
      save(KEYS.invites, invites);
      statusMsg = "Nouveau code généré : " + code;
      errorMsg = "";
      render();
    }

    async function register(e) {
      e.preventDefault();
      errorMsg = "";
      statusMsg = "";
      const pseudo = document.getElementById("regPseudo").value.trim();
      const pw = document.getElementById("regPw").value;
      const code = document.getElementById("regCode").value.trim().toUpperCase();

      if (!pseudo || pw.length < 4 || !code) {
        errorMsg = "Remplis le pseudo, un mot de passe (4+ caractères) et le code d'invitation.";
        return render();
      }

      const users = load(KEYS.users, []);
      if (users.some(u => u.pseudo.toLowerCase() === pseudo.toLowerCase())) {
        errorMsg = "Ce pseudo est déjà pris.";
        return render();
      }

      const invites = load(KEYS.invites, []);
      const inv = invites.find(i => i.code === code && !i.used);
      if (!inv) {
        errorMsg = "Code d'invitation invalide ou déjà utilisé.";
        return render();
      }

      inv.used = true;
      users.push({ pseudo, hash: await hashPassword(pw) });
      save(KEYS.invites, invites);
      save(KEYS.users, users);
      save(KEYS.session, pseudo);
      render();
    }

    async function login(e) {
      e.preventDefault();
      errorMsg = "";
      statusMsg = "";
      const pseudo = document.getElementById("logPseudo").value.trim();
      const pw = document.getElementById("logPw").value;
      const users = load(KEYS.users, []);
      const user = users.find(u => u.pseudo.toLowerCase() === pseudo.toLowerCase());
      if (!user || user.hash !== await hashPassword(pw)) {
        errorMsg = "Pseudo ou mot de passe incorrect.";
        return render();
      }
      save(KEYS.session, user.pseudo);
      render();
    }

    function logout() {
      localStorage.removeItem(KEYS.session);
      pendingImage = null;
      render();
    }

    function handleImage(e) {
      const file = e.target.files[0];
      errorMsg = "";
      if (!file) { pendingImage = null; return; }
      if (!["image/png", "image/gif"].includes(file.type)) {
        errorMsg = "Seules les images PNG et GIF sont acceptées.";
        e.target.value = "";
        return render();
      }
      if (file.size > MAX_IMG_BYTES) {
        errorMsg = "L'image dépasse la limite de 5 Mo.";
        e.target.value = "";
        return render();
      }
      const reader = new FileReader();
      reader.onload = () => {
        pendingImage = reader.result;
        statusMsg = "Image prête : " + file.name;
        render();
      };
      reader.readAsDataURL(file);
    }

    function sendMessage(e) {
      e.preventDefault();
      errorMsg = "";
      statusMsg = "";
      const session = load(KEYS.session, null);
      if (!session) return;

      const input = document.getElementById("msgText");
      const text = input.value.trim();
      if (text.length > MAX_TEXT) {
        errorMsg = "Maximum 2 000 caractères.";
        return render();
      }
      if (!text && !pendingImage) {
        errorMsg = "Écris un message ou joins une image PNG/GIF.";
        return render();
      }

      const messages = load(KEYS.messages, []);
      messages.push({
        id: Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        author: session,
        text,
        image: pendingImage,
        time: new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
      });
      save(KEYS.messages, messages);
      pendingImage = null;
      render();
    }

    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function render() {
      ensureInitialInvite();
      const app = document.getElementById("app");
      const session = load(KEYS.session, null);
      const invites = load(KEYS.invites, []);
      const unused = invites.filter(i => !i.used).map(i => i.code);

      if (!session) {
        app.innerHTML = `
          <header>
            <div>
              <h1>LOLOCHAT</h1>
              <div class="sub">Site statique sans serveur • Stockage navigateur</div>
            </div>
          </header>
          <div class="box grid">
            ${errorMsg ? `<div class="error">${escapeHtml(errorMsg)}</div>` : ""}
            <div class="sub">Code d'invitation disponible pour test local : <span class="invite-code">${unused[0] || "Aucun (générez-en un après connexion)"}</span></div>
            <form onsubmit="register(event)" class="grid">
              <strong>Créer un compte (avec invitation)</strong>
              <input id="regPseudo" placeholder="Pseudo (sans email)" maxlength="30" />
              <input id="regPw" type="password" placeholder="Mot de passe" />
              <input id="regCode" placeholder="Code d'invitation" />
              <button type="submit">S'inscrire</button>
            </form>
            <hr style="border:0;border-top:1px solid var(--border);width:100%" />
            <form onsubmit="login(event)" class="grid">
              <strong>Connexion</strong>
              <input id="logPseudo" placeholder="Pseudo" />
              <input id="logPw" type="password" placeholder="Mot de passe" />
              <button type="submit" class="secondary">Se connecter</button>
            </form>
          </div>
        `;
        return;
      }

      const messages = load(KEYS.messages, []);
      app.innerHTML = `
        <header>
          <div>
            <h1>LOLOCHAT — Salon commun</h1>
            <div class="sub">Connecté en tant que <strong>${escapeHtml(session)}</strong></div>
          </div>
          <div class="row">
            <button class="secondary" onclick="createInvite()">+ Code invitation</button>
            <button class="danger" onclick="logout()">Déconnexion</button>
          </div>
        </header>
        ${(errorMsg || statusMsg) ? `<div class="box" style="padding-bottom:0">
          ${errorMsg ? `<div class="error">${escapeHtml(errorMsg)}</div>` : ""}
          ${statusMsg ? `<div class="ok">${escapeHtml(statusMsg)}</div>` : ""}
        </div>` : ""}
        <div class="messages" id="msgList">
          ${messages.length === 0
            ? `<div class="sub">Aucun message pour le moment.</div>`
            : messages.map(m => `
              <div class="msg">
                <div class="msg-head">
                  <strong>${escapeHtml(m.author)}</strong>
                  <span>${escapeHtml(m.time)}</span>
                </div>
                ${m.text ? `<div>${escapeHtml(m.text).replaceAll("\n", "<br>")}</div>` : ""}
                ${m.image ? `<img src="${m.image}" alt="Image jointe" />` : ""}
              </div>
            `).join("")}
        </div>
        <form class="composer" onsubmit="sendMessage(event)">
          <textarea id="msgText" rows="3" maxlength="${MAX_TEXT}" placeholder="Écris ton message (max 2 000 caractères)..."></textarea>
          <div class="row" style="justify-content:space-between">
            <input type="file" accept="image/png,image/gif" onchange="handleImage(event)" style="max-width:280px" />
            <button type="submit">Envoyer</button>
          </div>
        </form>
      `;
      const list = document.getElementById("msgList");
      if (list) list.scrollTop = list.scrollHeight;
    }

    render();
  </script>
</body>
</html>
