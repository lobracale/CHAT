<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOLOCHAT — Salon privé P2P sans serveur</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #f87171;
      --ok: #4ade80;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 820px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.15rem; }
    .sub { color: var(--muted); font-size: 0.85rem; }
    .box { padding: 20px; }
    .grid { display: grid; gap: 12px; }
    .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 680px) { .two-cols { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: grid;
      gap: 10px;
      align-content: start;
    }
    input, textarea, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel);
      color: var(--text);
    }
    button {
      padding: 10px 14px;
      background: var(--accent);
      color: #06202a;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .code-badge {
      font-family: monospace;
      font-size: 1rem;
      background: var(--panel);
      color: var(--accent);
      border: 1px dashed var(--accent);
      padding: 6px 10px;
      border-radius: 8px;
      user-select: all;
    }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 420px;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .msg {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .msg.sys {
      border-style: dashed;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 8px 12px;
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .msg img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }
    .composer {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      background: var(--panel-2);
      display: grid;
      gap: 10px;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .error { color: var(--danger); font-size: 0.9rem; }
    .ok { color: var(--ok); font-size: 0.9rem; }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      background: rgba(74, 222, 128, 0.15);
      color: var(--ok);
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
    const MAX_TEXT = 2000;
    const MAX_IMG_BYTES = 5 * 1024 * 1024;
    const PREFIX = "lolochat-room-";

    let state = {
      view: "auth", // "auth" | "chat"
      role: null,   // "host" | "guest"
      pseudo: "",
      roomCode: "",
      peer: null,
      connections: [], // host: liste des connexions invités ; guest: [connexion vers host]
      members: [],
      messages: [],
      pendingImage: null,
      error: "",
      status: ""
    };

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function generateRoomCode() {
      const part1 = Math.floor(1000 + Math.random() * 9000);
      const part2 = Math.random().toString(36).substring(2, 6).toUpperCase();
      return `LOLO-${part1}-${part2}`;
    }

    async function checkOrSaveLocalAccount(pseudo, password) {
      const key = "lolochat_p2p_accounts";
      const accounts = JSON.parse(localStorage.getItem(key) || "{}");
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
      const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      const lower = pseudo.toLowerCase();

      if (accounts[lower] && accounts[lower] !== hash) {
        return false;
      }
      accounts[lower] = hash;
      localStorage.setItem(key, JSON.stringify(accounts));
      return true;
    }

    function addSystemMessage(text) {
      state.messages.push({ id: Date.now() + Math.random(), system: true, text });
      render();
    }

    function broadcastAsHost(payload, excludeConn = null) {
      state.connections.forEach(conn => {
        if (conn.open && conn !== excludeConn) {
          conn.send(payload);
        }
      });
    }

    function updateMembersList() {
      if (state.role === "host") {
        const names = [state.pseudo, ...state.connections.filter(c => c.open && c.metadata?.pseudo).map(c => c.metadata.pseudo)];
        state.members = [...new Set(names)];
        broadcastAsHost({ type: "members", members: state.members });
      }
    }

    async function createRoom(e) {
      e.preventDefault();
      state.error = "";
      const pseudo = document.getElementById("hostPseudo").value.trim();
      const pw = document.getElementById("hostPw").value;

      if (!pseudo || pw.length < 4) {
        state.error = "Entre un pseudo et un mot de passe (4 caractères minimum).";
        return render();
      }
      if (!await checkOrSaveLocalAccount(pseudo, pw)) {
        state.error = "Mot de passe incorrect pour ce pseudo sur cet appareil.";
        return render();
      }

      const code = generateRoomCode();
      state.status = "Création du code d'invitation...";
      render();

      const peer = new Peer(PREFIX + code);
      peer.on("open", () => {
        state.view = "chat";
        state.role = "host";
        state.pseudo = pseudo;
        state.roomCode = code;
        state.peer = peer;
        state.members = [pseudo];
        state.status = "";
        addSystemMessage(`Salon créé. Partage le code ${code} en privé pour inviter tes amis.`);
      });

      peer.on("connection", (conn) => {
        conn.on("open", () => {
          state.connections.push(conn);
          const guestName = conn.metadata?.pseudo || "Invité";
          updateMembersList();
          // Envoyer l'historique actuel au nouvel arrivant
          conn.send({ type: "history", messages: state.messages.filter(m => !m.system) });
          const joinNotice = { id: Date.now() + Math.random(), system: true, text: `${guestName} a rejoint le salon.` };
          state.messages.push(joinNotice);
          broadcastAsHost({ type: "system", text: joinNotice.text });
          render();
        });

        conn.on("data", (data) => {
          if (data.type === "chat") {
            state.messages.push(data.msg);
            broadcastAsHost({ type: "chat", msg: data.msg }, conn);
            render();
          }
        });

        conn.on("close", () => {
          const guestName = conn.metadata?.pseudo || "Un membre";
          state.connections = state.connections.filter(c => c !== conn);
          updateMembersList();
          const leftNotice = { id: Date.now() + Math.random(), system: true, text: `${guestName} a quitté le salon.` };
          state.messages.push(leftNotice);
          broadcastAsHost({ type: "system", text: leftNotice.text });
          render();
        });
      });

      peer.on("error", (err) => {
        state.error = "Erreur réseau : " + err.type;
        state.status = "";
        render();
      });
    }

    async function joinRoom(e) {
      e.preventDefault();
      state.error = "";
      const pseudo = document.getElementById("guestPseudo").value.trim();
      const pw = document.getElementById("guestPw").value;
      const code = document.getElementById("joinCode").value.trim().toUpperCase();

      if (!pseudo || pw.length < 4 || !code) {
        state.error = "Remplis le pseudo, le mot de passe (4+ caractères) et le code d'invitation.";
        return render();
      }
      if (!await checkOrSaveLocalAccount(pseudo, pw)) {
        state.error = "Mot de passe incorrect pour ce pseudo sur cet appareil.";
        return render();
      }

      state.status = "Connexion au salon en cours...";
      render();

      const peer = new Peer();
      peer.on("open", () => {
        const conn = peer.connect(PREFIX + code, { metadata: { pseudo } });

        conn.on("open", () => {
          state.view = "chat";
          state.role = "guest";
          state.pseudo = pseudo;
          state.roomCode = code;
          state.peer = peer;
          state.connections = [conn];
          state.status = "";
          addSystemMessage(`Connecté au salon ${code}.`);
        });

        conn.on("data", (data) => {
          if (data.type === "history") {
            state.messages = [...data.messages, ...state.messages];
            render();
          } else if (data.type === "chat") {
            state.messages.push(data.msg);
            render();
          } else if (data.type === "system") {
            addSystemMessage(data.text);
          } else if (data.type === "members") {
            state.members = data.members;
            render();
          }
        });

        conn.on("close", () => {
          addSystemMessage("L'hôte a fermé le salon.");
        });
      });

      peer.on("error", () => {
        state.error = "Impossible de rejoindre ce code (vérifie le code ou demande à l'hôte de garder sa page ouverte).";
        state.status = "";
        render();
      });
    }

    function handleImage(e) {
      const file = e.target.files[0];
      state.error = "";
      if (!file) { state.pendingImage = null; return; }
      if (!["image/png", "image/gif"].includes(file.type)) {
        state.error = "Seules les images PNG et GIF sont acceptées.";
        e.target.value = "";
        return render();
      }
      if (file.size > MAX_IMG_BYTES) {
        state.error = "L'image dépasse la limite de 5 Mo.";
        e.target.value = "";
        return render();
      }
      const reader = new FileReader();
      reader.onload = () => {
        state.pendingImage = reader.result;
        state.status = "Image prête : " + file.name;
        render();
      };
      reader.readAsDataURL(file);
    }

    function sendMessage(e) {
      e.preventDefault();
      state.error = "";
      state.status = "";
      const input = document.getElementById("msgText");
      const text = input.value.trim();

      if (text.length > MAX_TEXT) {
        state.error = "Maximum 2 000 caractères.";
        return render();
      }
      if (!text && !state.pendingImage) {
        state.error = "Écris un message ou choisis une image PNG/GIF.";
        return render();
      }

      const msg = {
        id: Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        author: state.pseudo,
        text,
        image: state.pendingImage,
        time: new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
      };

      state.messages.push(msg);
      if (state.role === "host") {
        broadcastAsHost({ type: "chat", msg });
      } else if (state.connections[0]?.open) {
        state.connections[0].send({ type: "chat", msg });
      }

      state.pendingImage = null;
      render();
    }

    function copyCode() {
      navigator.clipboard?.writeText(state.roomCode);
      state.status = "Code copié dans le presse-papiers !";
      render();
    }

    function leaveRoom() {
      if (state.peer) state.peer.destroy();
      state = {
        view: "auth",
        role: null,
        pseudo: "",
        roomCode: "",
        peer: null,
        connections: [],
        members: [],
        messages: [],
        pendingImage: null,
        error: "",
        status: ""
      };
      render();
    }

    function render() {
      const app = document.getElementById("app");

      if (state.view === "auth") {
        app.innerHTML = `
          <header>
            <div>
              <h1>LOLOCHAT</h1>
              <div class="sub">Messagerie privée directe entre personnes • Sans serveur</div>
            </div>
          </header>
          <div class="box grid">
            ${state.error ? `<div class="error">${escapeHtml(state.error)}</div>` : ""}
            ${state.status ? `<div class="ok">${escapeHtml(state.status)}</div>` : ""}
            <div class="two-cols">
              <form class="card" onsubmit="createRoom(event)">
                <strong>1. Créer un salon & générer un code</strong>
                <div class="sub">Tu obtiens un code unique à envoyer à tes amis.</div>
                <input id="hostPseudo" placeholder="Ton pseudo" maxlength="25" required />
                <input id="hostPw" type="password" placeholder="Mot de passe" required />
                <button type="submit">Créer le code d'invitation</button>
              </form>

              <form class="card" onsubmit="joinRoom(event)">
                <strong>2. Rejoindre avec un code</strong>
                <div class="sub">Entre le code reçu par un ami pour discuter en direct.</div>
                <input id="guestPseudo" placeholder="Ton pseudo" maxlength="25" required />
                <input id="guestPw" type="password" placeholder="Mot de passe" required />
                <input id="joinCode" placeholder="Code (ex: LOLO-1234-ABCD)" required />
                <button type="submit" class="secondary">Rejoindre le salon</button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      app.innerHTML = `
        <header>
          <div>
            <h1>LOLOCHAT <span class="pill">${state.members.length} en ligne</span></h1>
            <div class="sub">Connecté : <strong>${escapeHtml(state.pseudo)}</strong> (${state.members.map(escapeHtml).join(", ")})</div>
          </div>
          <div class="row">
            <span class="code-badge" title="Code à partager">${escapeHtml(state.roomCode)}</span>
            <button class="secondary" onclick="copyCode()">Copier le code</button>
            <button class="danger" onclick="leaveRoom()">Quitter</button>
          </div>
        </header>
        ${(state.error || state.status) ? `<div class="box" style="padding-bottom:0">
          ${state.error ? `<div class="error">${escapeHtml(state.error)}</div>` : ""}
          ${state.status ? `<div class="ok">${escapeHtml(state.status)}</div>` : ""}
        </div>` : ""}
        <div class="messages" id="msgList">
          ${state.messages.map(m => m.system
            ? `<div class="msg sys">${escapeHtml(m.text)}</div>`
            : `
              <div class="msg">
                <div class="msg-head">
                  <strong>${escapeHtml(m.author)}</strong>
                  <span>${escapeHtml(m.time)}</span>
                </div>
                ${m.text ? `<div>${escapeHtml(m.text).replaceAll("\n", "<br>")}</div>` : ""}
                ${m.image ? `<img src="${m.image}" alt="Image jointe" />` : ""}
              </div>
            `
          ).join("")}
        </div>
        <form class="composer" onsubmit="sendMessage(event)">
          <textarea id="msgText" rows="3" maxlength="${MAX_TEXT}" placeholder="Écris ton message (max 2 000 caractères)..."></textarea>
          <div class="row" style="justify-content:space-between">
            <input type="file" accept="image/png,image/gif" onchange="handleImage(event)" style="max-width:280px" />
            <button type="submit">Envoyer</button>
          </div>
        </form>
      `;

      const list = document.getElementById("msgList");
      if (list) list.scrollTop = list.scrollHeight;
    }

    render();
  </script>
</body>
</html>
